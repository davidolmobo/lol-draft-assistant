name: Collect match data

on:
  schedule:
    # Cada 15 minutos. GitHub Actions no garantiza el minuto exacto, puede
    # retrasarse unos minutos en horas de mucha carga.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  # Evita que dos ejecuciones corran a la vez si una se retrasa y se
  # solapa con la siguiente (ambas cogerían el mismo jugador de la cola).
  # En vez de cancelar la que ya está corriendo, la nueva espera su turno.
  group: collect-match-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Run collector
        working-directory: apps/worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: npm run collect
