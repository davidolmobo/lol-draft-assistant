name: Collect match data

on:
  schedule:
    # Cada 20 minutos. Los cron muy frecuentes (cada 15 min o menos) de
    # GitHub Actions se saltan ejecuciones con bastante frecuencia, es una
    # limitación conocida de su scheduler. Como cada ejecución ahora dura
    # ~25 min (ver apps/worker/src/collect.ts), casi siempre habrá una
    # corriendo o a punto de arrancar, así que un disparo ocasional
    # perdido apenas se nota.
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

concurrency:
  # Evita que dos ejecuciones corran a la vez si una se retrasa y se
  # solapa con la siguiente (ambas cogerían el mismo jugador de la cola).
  # En vez de cancelar la que ya está corriendo, la nueva espera su turno
  # (con ejecuciones de ~25 min y disparos cada 20 min, esto pasará a
  # menudo, y es justo lo que queremos: cobertura casi continua).
  group: collect-match-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Run collector
        working-directory: apps/worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: npm run collect
