name: Collect match data

on:
  schedule:
    # Cada hora. GitHub Actions no garantiza el minuto exacto, puede
    # retrasarse unos minutos en horas de mucha carga.
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Run collector
        working-directory: apps/worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: npm run collect
